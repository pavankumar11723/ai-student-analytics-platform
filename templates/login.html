
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Analytics - Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .login-box {
            width: 350px;
            max-width: 90%;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0002;
        }

        h2 {
            text-align: center;
            color: #3730a3;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            border-radius: 6px;
            font-size: 15px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .message {
            color: #dc2626;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Student Analytics</h2>
        <p style="text-align:center;">Sign in to continue</p>

        {% for message in get_flashed_messages() %}
            <p class="message">{{ message }}</p>
        {% endfor %}

        <form method="POST" action="{{ url_for('login') }}">
            <input
                type="text"
                name="username"
                placeholder="Username / Roll Number"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
